name: Release

# On a version tag (v0.1.0): check, build the MSI and the portable zip, and draft a GitHub
# release with them and their SHA-256 checksums. The draft is published by hand, after the
# manual checklist in docs/RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and draft the release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2

      - name: The tag matches the version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "The tag $env:GITHUB_REF_NAME doesn't match Cargo.toml's version $version."
          }
          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Licences, advisories, sources
        run: cargo deny check

      # The vendored bundles are the pinned files, and LICENSES.md audited each of them.
      - name: Verify the pinned JavaScript
        shell: pwsh
        run: ./scripts/fetch-js.ps1 -VerifyOnly

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149
      - name: Tests
        run: cargo nextest run --workspace --locked --profile ci

      - name: Build tools (cargo-about, WiX)
        shell: pwsh
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          dotnet tool install --global wix --version 5.0.2

      # The notices run cargo-about offline, which needs every crate in Cargo.lock, the other
      # platforms' too; the build and tests only fetched Windows's.
      - name: Fetch every locked crate
        run: cargo fetch --locked

      - name: Build
        run: cargo build --release --locked --bin legible

      # Signing comes later. When there's a certificate, sign the exe here, before it's
      # packaged, and the MSI after, for example:
      # - name: Sign the exe
      #   shell: pwsh
      #   run: signtool sign /fd SHA256 /tr http://timestamp.example /td SHA256 /f cert.pfx `
      #          /p "${{ secrets.SIGNING_PASSWORD }}" target/release/legible.exe

      - name: Build the MSI, the zip and the checksums
        shell: pwsh
        # Fails if THIRD-PARTY-NOTICES.txt is out of date, or the packages don't hold what
        # they should.
        run: ./scripts/package.ps1 -NoBuild

      # The version's section of CHANGELOG.md, without its heading (the release's title names the
      # version). GitHub shows a release's line breaks, so each paragraph and list item is joined
      # onto one line.
      - name: The release notes
        shell: pwsh
        run: |
          $section = $null
          $lines = [System.Collections.Generic.List[string]]::new()
          foreach ($line in Get-Content -Encoding utf8 CHANGELOG.md) {
            if ($line.StartsWith('## ')) {
              if ($section) { break }
              $section = $line.StartsWith("## [$env:VERSION]")
              continue
            }
            if (-not $section) { continue }
            $continues = $lines.Count -gt 0 -and $lines[-1] -ne '' -and -not $lines[-1].StartsWith('#') `
              -and $line -ne '' -and -not $line.StartsWith('#') -and -not $line.StartsWith('- ')
            if ($continues) { $lines[-1] += ' ' + $line.Trim() } else { $lines.Add($line) }
          }
          $notes = ($lines -join "`n").Trim()
          if (-not $notes) { throw "CHANGELOG.md has no notes for $env:VERSION." }
          if ($notes -notmatch 'SHA256SUMS') {
            $notes += "`n`nCheck a download against SHA256SUMS.txt before running it."
          }
          Set-Content -Encoding utf8 target/dist/notes.md $notes

      - name: Draft the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME --draft --verify-tag `
            --title "Legible $env:VERSION" --notes-file target/dist/notes.md `
            "target/dist/legible-$env:VERSION-x64.msi" `
            "target/dist/legible-$env:VERSION-portable.zip" `
            target/dist/SHA256SUMS.txt
