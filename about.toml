# cargo-about: the crates part of THIRD-PARTY-NOTICES.txt (scripts/third-party-notices.ps1).
# The same licence rule as deny.toml: MIT or equally permissive only.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
# Only what ships: the Windows build, without dev or build dependencies.
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
# Legible's own crates are under its LICENSE, which ships beside this file.
private = { ignore = true }

# The maintainer's only exceptions (deny.toml, third_party/rust/LICENSES.md): two MPL-2.0 crates
# ammonia needs, shipped unmodified and credited with where their source is.
[cssparser]
accepted = ["MPL-2.0"]

[dtoa-short]
accepted = ["MPL-2.0"]
